spring:
  application:
    name: BE
  # 대괄호가 들어 있어 YAML에서 흐름 시퀀스로 읽히지 않도록 따옴표로 감싼다
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    # 스키마 소유권은 Flyway에 있고 Hibernate는 매핑 검증만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false

  jackson:
    mapper:
      # 응답 필드를 API 명세서와 같은 선언 순서로 내려준다
      sort-properties-alphabetically: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

news:
  agent:
    enabled: ${AGENT_ENABLED:false}
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8088}
    token: ${AGENT_SHARED_SECRET:}
    connect-timeout: 5s
    analyze-timeout: 30s
    report-timeout: 120s
    default-plan: FREE
    allow-run-override: true
    # 분석 캐시는 콘텐츠뿐 아니라 현재 프롬프트·플랜별 모델 계약까지 같을 때만 사용한다.
    analysis-prompt-version: ${AGENT_ANALYSIS_PROMPT_VERSION:analyze.ko.v2+perspective.ko.v1}
    free-model: ${GEMINI_MODEL:}
    paid-model: ${MINDLOGIC_CLAUDE_MODEL:}
    quota:
      free-run-article-limit: 30
      free-daily-calls: 1500
      paid-monthly-credits: 3000
      paid-daily-credits: 90
      paid-daily-report-reserve: 20
      paid-run-article-limit: 20
      # 실사용량이 없을 때 적용할 요청당 환산값과 Agent hard cap. 호출 전에는 hard cap을 예약한다.
      paid-credits-per-request: 1
      paid-max-credits-per-request: ${AGENT_HARD_CAP_CREDITS_PER_REQUEST:5}
      reservation-ttl: 15m
