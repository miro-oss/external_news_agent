spring:
  application:
    name: BE
  # 대괄호가 들어 있어 YAML에서 흐름 시퀀스로 읽히지 않도록 따옴표로 감싼다
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    # 스키마 소유권은 Flyway에 있고 Hibernate는 매핑 검증만 한다
    hibernate:
      ddl-auto: validate
    open-in-view: false

  jackson:
    mapper:
      # 응답 필드를 API 명세서와 같은 선언 순서로 내려준다
      sort-properties-alphabetically: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

news:
  reports:
    daily:
      enabled: true
      max-issues: 10
      poll-interval-ms: 300000
  collection:
    # 조합별 선착순 상한 대신 주제 전체 후보를 IDF topicFit으로 정렬해 고른다.
    topic-article-limit: 300
    # 본문 HTTP 요청은 run 전체에서 IDF topicFit 상위 기사만 수행한다.
    fulltext-limit-per-run: 300
  analysis:
    # 기사 수가 아니라 이번 실행에서 변화가 생긴 이슈 대표 수를 제한한다.
    issue-limit-per-run: 30
    sensitivity:
      customer-move-weight: 0.35
      deal-signal-weight: 0.30
      competitor-threat-weight: 0.20
      industry-shift-weight: 0.15
      medium-threshold: 40
      high-threshold: 70
  clustering:
    # P1-1 골든 클러스터셋 홀드아웃 스윕에서 고정한 균등 자카드 기준이다.
    title-jaccard-threshold: 0.50
    entity-time-window: 48h
    # 같은 조직명 + 약한 제목 겹침은 한 뉴스 주기 안에서만 보조 간선으로 쓴다.
    organization-time-window: 24h
    organization-title-jaccard-threshold: 0.125
    # 속보는 마커를 제거한 핵심구와 엔티티를 더 짧은 시간창에서만 비교한다.
    breaking-time-window: 6h
    entity-overlap-threshold: 2
    simhash-hamming-threshold: 3
    # 잘린 요약·매체 푸터만으로 동일 본문 그룹을 만들지 않는다.
    min-article-content-length: 200
  notifications:
    # 미설정 시 자동 속보 알림은 전송하지 않는다. 활성 알림 그룹 ID를 명시적으로 지정해야 한다.
    breaking-group-id: ${BREAKING_NOTIFICATION_GROUP_ID:}
    telegram:
      base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    smtp:
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
    connect-timeout: 5s
    read-timeout: 10s
  agent:
    enabled: ${AGENT_ENABLED:false}
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8088}
    token: ${AGENT_SHARED_SECRET:}
    connect-timeout: 5s
    analyze-timeout: ${AGENT_ANALYZE_TIMEOUT:90s}
    # Agent provider 기본 60초보다 네트워크·응답 직렬화 여유를 둔다.
    insight-timeout: ${AGENT_INSIGHT_TIMEOUT:75s}
    report-timeout: 120s
    default-plan: FREE
    allow-run-override: true
    # 분석 캐시는 콘텐츠뿐 아니라 현재 프롬프트·플랜별 모델 계약까지 같을 때만 사용한다.
    analysis-prompt-version: ${AGENT_ANALYSIS_PROMPT_VERSION:analyze.ko.v6+perspective.ko.v1+sensitivity.ko.v2}
    free-analysis-prompt-version: ${AGENT_FREE_ANALYSIS_PROMPT_VERSION:analyze.ko.v9+perspective.ko.v1+sensitivity.ko.v2}
    insight-prompt-version: ${AGENT_INSIGHT_PROMPT_VERSION:insight.ko.v2+perspective.ko.v1}
    free-model: ${OPENAI_MODEL:gpt-4.1-nano}
    paid-model: ${MINDLOGIC_CLAUDE_MODEL:}
    insight-history:
      days: 30
      limit: 6
    investigation:
      candidate-limit: 5
      evidence-threshold: 3
      search-batch-size: 10
      daily-budget-percent: 15
    quota:
      free-daily-calls: 1500
      paid-monthly-credits: 3000
      paid-daily-credits: 90
      paid-daily-report-reserve: 20
      # 완료 건수가 아니라 진행 중 예약까지 포함한 PAID 인사이트 크레딧 상한이다.
      paid-daily-insight-cap: 15
      # 실사용량이 없을 때 적용할 요청당 환산값과 Agent hard cap. 호출 전에는 hard cap을 예약한다.
      paid-credits-per-request: 1
      paid-max-credits-per-request: ${AGENT_HARD_CAP_CREDITS_PER_REQUEST:5}
      reservation-ttl: 15m
