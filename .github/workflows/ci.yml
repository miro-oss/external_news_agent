name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 버전을 여기 적지 않는다. version이 없으면 action이 packageManager 필드를 읽으므로
      # CI와 로컬이 같은 한 곳을 본다. defaults의 working-directory는 run 스텝에만 걸리고
      # action 입력에는 걸리지 않아서, 레포 루트가 아닌 FE/package.json을 명시해야 한다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: FE/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: FE/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            BE/*.gradle
            BE/gradle/wrapper/gradle-wrapper.properties

      - name: Grant Gradle wrapper permission
        run: chmod +x BE/gradlew

      - name: Test
        working-directory: BE
        run: ./gradlew test
